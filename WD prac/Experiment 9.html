
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Product Grid</title>
<style>
    body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
    }

    .outer-box {
        border: 3px solid black;
        padding: 40px;
    }

    h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 40px;
    }

    .grid-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .card img {
        width: 120px;
        margin-bottom: 15px;
    }

    .card h2 {
        font-size: 22px;
        margin-bottom: 10px;
    }

    .card p {
        font-size: 16px;
        color: #555;
        margin-bottom: 10px;
    }

    .price {
        font-size: 20px;
        font-weight: bold;
    }

    /* Responsive Breakpoints */

    @media (max-width: 1200px) {
        .grid-container {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 900px) {
        .grid-container {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        .grid-container {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body>

<div class="outer-box">

    <h1>Responsive Product Grid</h1>

    <div class="grid-container">

        <div class="card">
            <img src="https://via.placeholder.com/120" alt="Product 1">
            <h2>Product 1</h2>
            <p>High-quality item with great features.</p>
            <div class="price">₹499</div>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/120" alt="Product 2">
            <h2>Product 2</h2>
            <p>Durable and stylish for daily use.</p>
            <div class="price">₹799</div>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/120" alt="Product 3">
            <h2>Product 3</h2>
            <p>Lightweight and comfortable.</p>
            <div class="price">₹1,299</div>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/120" alt="Product 4">
            <h2>Product 4</h2>
            <p>Trendy design with premium quality.</p>
            <div class="price">₹999</div>
        </div>

    </div>
</div>
</body>
</html>
